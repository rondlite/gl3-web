name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site build is verified here because no unit test covers it, so a
      # broken VitePress config would otherwise reach the image. It runs before
      # the tests, not after, because one of them asserts that the stylesheet
      # discovery still matches the markup Vite emits, and that test skips
      # itself when there is no build to read.
      - run: npm run build:site
      - run: npm run typecheck
      - run: npm test
      # Greps the <noscript> fallback sentence rather than a CSS class name.
      # That sentence only ships if the fallback exists, so this check depends
      # on the page being useful without JavaScript, not just on the grid
      # component having mounted at some point during the build.
      - name: Check the plugins page has a no-JS fallback
        run: grep -q "needs JavaScript to load the plugin catalogue" site/.vitepress/dist/plugins.html
      # VitePress intercepts every same origin link ending in .html and resolves
      # it against its own route table. Plugin pages are rendered by the server
      # and are not in that table, so without target="_self" on the card link
      # every plugin title renders VitePress's 404 instead of the page. Nothing
      # else catches this: the build succeeds, the tests pass, and the failure
      # appears only when a visitor clicks. The chunk name is content hashed,
      # hence the glob.
      - name: Check plugin links bypass the VitePress router
        run: grep -rq 'target:"_self"' site/.vitepress/dist/assets/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds without pushing, so a Dockerfile break is a red PR check
      # instead of a red publish job on main after the change already merged.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
